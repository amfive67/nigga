<!DOCTYPE html>
<html ng-app="studentApp">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <style>
    body{font-family:Arial;margin:30px;background:#f5f5f5}
    .box{background:white;padding:20px;border-radius:10px;max-width:1100px;margin:auto}
    input,button{padding:9px;margin:5px}
    button{cursor:pointer}
    table{border-collapse:collapse;width:100%;margin-top:20px;background:white}
    th,td{border:1px solid #999;padding:10px;text-align:center}
    th{background:#222;color:white}
    .edit{background:#ffc107;border:0}
    .delete{background:#dc3545;color:white;border:0}
    .save{background:#198754;color:white;border:0}
  </style>
</head>
<body ng-controller="StudentController">
<div class="box">
  <h1>Student Management System</h1>

  <input placeholder="Search Student" ng-model="searchText">
  <hr>

  <input placeholder="Student Name" ng-model="student.name">
  <input placeholder="Roll No" ng-model="student.rollNo">
  <input placeholder="Course" ng-model="student.course">
  <input type="number" placeholder="Semester" ng-model="student.semester">
  <input type="email" placeholder="Email" ng-model="student.email">
  <input type="number" placeholder="Marks" ng-model="student.marks">

  <button class="save" ng-click="saveStudent()">
    {{editing ? 'Update Student' : 'Add Student'}}
  </button>
  <button ng-if="editing" ng-click="cancelEdit()">Cancel</button>

  <h2>Student List</h2>
  <table>
    <tr>
      <th>Name</th><th>Roll No</th><th>Course</th><th>Semester</th>
      <th>Email</th><th>Marks</th><th>Action</th>
    </tr>
    <tr ng-repeat="s in students | filter:searchText">
      <td>{{s.name}}</td>
      <td>{{s.rollNo}}</td>
      <td>{{s.course}}</td>
      <td>{{s.semester}}</td>
      <td>{{s.email}}</td>
      <td>{{s.marks}}</td>
      <td>
        <button class="edit" ng-click="editStudent(s)">Edit</button>
        <button class="delete" ng-click="deleteStudent(s._id)">Delete</button>
      </td>
    </tr>
  </table>
</div>

<script>
var app = angular.module("studentApp", []);

app.controller("StudentController", function($scope, $http) {
  $scope.student = {};
  $scope.students = [];
  $scope.editing = false;

  $scope.loadStudents = function() {
    $http.get("/students").then(function(response) {
      $scope.students = response.data;
    });
  };

  $scope.saveStudent = function() {
    if ($scope.editing) {
      $http.put("/students/" + $scope.student._id, $scope.student)
        .then(function(response) {
          $scope.loadStudents();
          $scope.student = {};
          $scope.editing = false;
        });
    } else {
      $http.post("/students", $scope.student)
        .then(function(response) {
          $scope.students.push(response.data);
          $scope.student = {};
        });
    }
  };

  $scope.editStudent = function(s) {
    $scope.student = angular.copy(s);
    $scope.editing = true;
  };

  $scope.cancelEdit = function() {
    $scope.student = {};
    $scope.editing = false;
  };

  $scope.deleteStudent = function(id) {
    if (confirm("Delete this student?")) {
      $http.delete("/students/" + id).then(function() {
        $scope.loadStudents();
      });
    }
  };

  $scope.loadStudents();
});
</script>
</body>
</html>
